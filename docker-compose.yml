services:
  db:
    image: postgres:latest
    container_name: traffic-postgres
    restart: always
    volumes:
      - traffic-postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=traffic
      - POSTGRES_NAME=traffic
      - POSTGRES_USER=traffic@user
      - POSTGRES_PASSWORD=traffic@2684
      - POSTGRES_HOST=traffic
      - POSTGRES_PORT=5432
    expose:
      - "5432"

  backend:
    image: traffic
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: traffic-backend
    environment:
      - DEBUG=True
      - SECRET_KEY=Fahim12345678@86;
      - ALLOWED_HOSTS=localhost,127.0.0.1
    ports:
     - "8000:8000"
    command: "python manage.py runserver 0.0.0.0:8000"
    volumes:
      - traffic-backend:/usr/src/app
    depends_on:
      - db
  
volumes:
  traffic-postgres:
  traffic-backend: